const FB=Object.assign({apiKey:"AIzaSyBvHS0i-zt_P64YU0RpEJvMrSQrzPfGZNQ",authDomain:"aurora-49e47.firebaseapp.com",projectId:"aurora-49e47",messagingSenderId:"944073615737",appId:"1:944073615737:web:e1db4bf80f7241b7d5a7a8"},(()=>{try{return JSON.parse(localStorage.getItem('fbcfg')||'{}')}catch(e){return{}}})());

const nftC=n=>n?`<span class="nft a-${E(n.a||'fl')}" style="--c:${E(n.c)}"><i>${E(n.e)}</i><b>${E(n.name)}</b></span>`:'';

const wornL=id=>{const u=U[id]||{},l=u.wr||(u.wear?[u.wear]:[]);return l.filter(i=>(G[id]?.n||[]).includes(i)&&N[i])};
const orbit=(a,ids)=>{const S=[[80,20],[20,20],[92,50],[8,50],[80,80],[20,80]];return `<div class=orb>${a}${ids.slice(0,6).map((i,k)=>{const n=N[i];return n?`<div class="nf a-${E(n.a||'fl')}" style="left:${S[k][0]}%;top:${S[k][1]}%;--c:${E(n.c)}" title="${E(n.name)}"><i>${E(n.e)}</i></div>`:''}).join('')}</div>`};
const gset=(id,p)=>db.doc('grants/'+id).set({...(G[id]||{}),...p});
const dmId=o=>'dm_'+[uid,o].sort().join('_');
const chName=c=>c.t==='dm'?(U[c.m.find(x=>x!==uid)]?.name||'Аноним'):c.name;
const chAv=c=>c.t==='dm'?U[c.m.find(x=>x!==uid)]?.av||'🌀':c.av||(c.t==='channel'?'📢':'💬');

let started=false,fauth,am='login',msg='';
if(!FB.apiKey)setup();
else if(typeof firebase==='undefined'){$('#app').innerHTML='<div class=c><div class=lg>'+logo(64)+'</div><h2>Не удалось загрузить Firebase</h2><p class=mu>Файл открыт во встроенном просмотре, где внешние скрипты блокируются. Разместите файл на сайте (например, GitHub Pages) и откройте его в обычном браузере.</p></div>'}
else{
 firebase.initializeApp(FB);fauth=firebase.auth();db=firebase.firestore();
 fauth.onAuthStateChanged(async u=>{
  if(!u){uid=null;U={};G={};loaded=false;view='';auth();return}
  try{await u.reload();await u.getIdToken(true)}catch(e){}
  const cu=fauth.currentUser||u;uid=cu.uid;owner=!!(cu.emailVerified&&cu.email===ADMIN_EMAIL);

 });
}
function setup(){$('#app').innerHTML=`<div id=pg><div class=c><div class=lg>${logo(64)}</div><h2>Подключение Firebase</h2><p class=mu>Вставьте блок firebaseConfig из консоли Firebase (кнопка копирования в окне с кодом)</p></div><textarea id=fc rows=8 placeholder="const firebaseConfig = {...}"></textarea><div class=err id=er></div><button style="width:100%" onclick="saveCfg()">Подключить</button></div>`}
function saveCfg(){const t=$('#fc').value,g=k=>(t.match(new RegExp(k+'\\s*:\\s*"([^"]+)"'))||[])[1],o={};['apiKey','authDomain','projectId','appId','messagingSenderId'].forEach(k=>{const v=g(k);if(v)o[k]=v});if(!o.apiKey)return $('#er').textContent='Не нашёл apiKey в тексте';try{localStorage.setItem('fbcfg',JSON.stringify(o))}catch(e){}location.reload()}
function listen(){
 db.collection('users').onSnapshot(s=>{U={};s.docs.forEach(d=>U[d.id]=d.data());loaded=true;draw()});
 db.collection('grants').onSnapshot(s=>{G={};s.docs.forEach(d=>G[d.id]=d.data());
  if(owner&&!fixed&&U[uid]&&G[uid]?.r!=='creator'){fixed=true;gset(uid,{r:'creator',v:true})}draw()});
 db.collection('nfts').onSnapshot(s=>{N={...PRE};s.docs.forEach(d=>N[d.id]=d.data());draw()});
 db.collection('msgs').onSnapshot(s=>{LM={};s.docs.forEach(d=>{const m=d.data();if(!LM[m.cid]||m.ts>LM[m.cid].ts)LM[m.cid]=m});draw()});
 db.collection('chats').onSnapshot(s=>{CH=s.docs.map(d=>({id:d.id,...d.data()}));if(cur){const f=CH.find(x=>x.id===cur.id);if(f)cur=f}draw()});
}

function draw(){
 if(!loaded||!uid)return;
 if(!U[uid])return auth('prof');
 shell();
 const a=document.activeElement;if(a&&a.closest&&a.closest('#pg')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 page();
}
const FE=c=>({'auth/email-already-in-use':'Этот email уже зарегистрирован','auth/invalid-email':'Неверный email','auth/weak-password':'Пароль минимум 6 символов','auth/missing-password':'Введите пароль','auth/invalid-credential':'Неверный email или пароль','auth/user-not-found':'Неверный email или пароль','auth/wrong-password':'Неверный email или пароль','auth/too-many-requests':'Слишком много попыток, подождите','auth/operation-not-allowed':'В Firebase не включён вход по email/паролю','auth/unauthorized-domain':'Домен не добавлен в Firebase (Authorized domains)'}[c]||'Ошибка: '+c);
function auth(m){
 m=m==='prof'?'prof':am;if(view==='auth'+m)return;view='auth'+m;
 const rg=m==='reg',pr=m==='prof',t=msg;msg='';
 $('#app').innerHTML=`<div id=pg><div class=c><div class=lg>${logo(64)}</div><h1>Aurora</h1></div>
 ${pr?'<p class=mu style="text-align:center">Осталось создать профиль</p>':`<div class=tabs><button class="${rg?'':'g'}" onclick="am='reg';view='';auth()">Регистрация</button><button class="${rg?'g':''}" onclick="am='login';view='';auth()">Вход</button></div>`}
 ${rg||pr?'<input id=rn placeholder="Имя"><input id=rk placeholder="Ник (латиница, цифры, _)" autocapitalize=off>':''}

 ${rg?'<input id=rt type=tel placeholder="Номер телефона (по желанию)">':''}
 <div class=err id=er>${E(t)}</div><button style="width:100%" onclick="${pr?'mkProf()':rg?'reg()':'login()'}">${pr?'Создать профиль':rg?'Зарегистрироваться':'Войти'}</button>
 ${m==='login'?'<button class=g style="width:100%;margin-top:8px" onclick="forgot()">Забыли пароль?</button>':''}</div>`;
}
const okNick=(n,k)=>n&&/^[a-z0-9_]{3,20}$/.test(k);

 const n=$('#rn').value.trim(),k=$('#rk').value.trim().toLowerCase();

function res(){
 const q=($('#sq')?.value||'').trim().toLowerCase().replace(/^@/,''),r=$('#sr');if(!r)return;
 const us=Object.entries(U).filter(([i,u])=>i!==uid&&(!q||u.nick.includes(q)||u.name.toLowerCase().includes(q)));
 const cs=CH.filter(c=>c.t!=='dm'&&c.pub&&(!q||c.name.toLowerCase().includes(q)));
 r.innerHTML=us.map(([i,u])=>`<div class=row onclick="showP('${i}')">${av(i)}<div><b>${nm(i)}</b>${bd(i)}<div class=mu>@${E(u.nick)}</div></div></div>`).join('')+
 cs.map(c=>`<div class=row onclick="openCh('${c.id}')"><div class=av>${E(chAv(c))}</div><div><b>${E(c.name)}</b><div class=mu>${c.t==='channel'?'Канал':'Чат'} · ${c.m.length} уч.${c.m.includes(uid)?'':' · нажмите, чтобы вступить'}</div></div></div>`).join('')||'<div class="c mu">Ничего не найдено</div>';
}
function prof(id,box,own){
 const g=G[id]||{},u=U[id];if(!u)return;const mine=(g.n||[]).map(i=>N[i]?{i,...N[i]}:null).filter(Boolean);
 box.innerHTML=`<div class="card hero" style="text-align:center">${orbit(av(id),wornL(id))}<h2>${nm(id)}${bd(id)}</h2><div class=mu>@${E(u.nick)}</div>
 <p>${E(u.bio)||'<span class=mu>Нет описания</span>'}</p><div class=dia>💎 ${g.d||0}</div>
 </div>
 <h3>NFT (${mine.length})</h3><div class=card>${mine.map(n=>`<div style="display:flex;align-items:center">${nftC(n)}${own?`<button class=g style="margin-left:auto" onclick="wear('${n.i}')">${wornL(id).includes(n.i)?'Снять':'Надеть'}</button>`:''}</div>`).join('')||'<span class=mu>Пока нет NFT</span>'}</div>
 ${own?`<h3>Редактор профиля</h3><div class=card><input id=en value="${E(u.name)}" placeholder="Имя"><input id=ea value="${E(u.av)}" placeholder="Аватар (эмодзи)"><textarea id=eb rows=3 placeholder="О себе">${E(u.bio)}</textarea><div class=err id=ee></div><button onclick="saveP()">Сохранить</button> <button class=g onclick="logout()">Выйти</button></div>`
 :`<button style="width:100%" onclick="dm('${id}')">Написать</button>`}`;
}
async function saveP(){
 const n=$('#en').value.trim();if(!n)return $('#ee').textContent='Введите имя';
 await db.doc('users/'+uid).set({...U[uid],name:n.slice(0,30),av:Array.from($('#ea').value.trim()||'🌀')[0],bio:$('#eb').value.slice(0,200)});
 $('#ee').textContent='Сохранено ✓';
}
const wear=i=>{const l=wornL(uid);return db.doc('users/'+uid).set({...U[uid],wr:l.includes(i)?l.filter(x=>x!==i):[...l,i].slice(-6),wear:null})};
function logout(){fauth.signOut()}
function showP(id){$('#md').innerHTML='<div class=ov><div class=hd><button class=g onclick="$(\'#md\').innerHTML=\'\'">←</button><b>Профиль</b></div><div id=mp style="flex:1;overflow:auto;padding:14px"></div></div>';prof(id,$('#mp'),false)}
async function dm(o){
 const id=dmId(o);if(!CH.some(c=>c.id===id))await db.doc('chats/'+id).set({t:'dm',m:[uid,o],o:uid,ts:Date.now()});
 $('#md').innerHTML='';openCh(id);
}
async function newCh(t){
 const n=prompt(t==='chat'?'Название чата':'Название канала');if(!n||!n.trim())return;
 const r=await db.collection('chats').add({t,name:n.trim().slice(0,40),o:uid,m:[uid],pub:true,ts:Date.now()});openCh(r.id);
}
async function openCh(id,c0){
 let c=c0||CH.find(x=>x.id===id);if(!c)return;
 if(!c.m.includes(uid)){await db.doc('chats/'+id).set({...c,m:[...c.m,uid]});c={...c,m:[...c.m,uid]}}
 cur=c;const ro=c.t==='channel'&&c.o!==uid;
 $('#md').innerHTML=`<div class=ov><div class=hd><button class=ib onclick="closeCh()">←</button><div class=av style="width:40px;height:40px;font-size:22px">${E(chAv(c))}</div><div style="flex:1;cursor:pointer" onclick="chInfo()"><b>${E(chName(c))}</b><div class=mu style="font-size:12px">${c.t==='dm'?'в сети':c.m.length+' участн.'}</div></div><button class=ib onclick="chInfo()">⋮</button></div><div id=ml></div>
 ${ro?'<div class="sb mu">Публикует только владелец канала</div>':'<div id=ep></div><div class=sb><button class=ib onclick="tgE()">🙂</button><input id=mi placeholder="Сообщение" onkeydown="if(event.key===\'Enter\')send()"><button class=ib onclick="send()">➤</button></div>'}</div>`;
 if(unM)unM();
 unM=db.collection('msgs').where('cid','==',id).onSnapshot(s=>{msgs=s.docs.map(d=>d.data()).sort((a,b)=>a.ts-b.ts);ml()});
}
function ml(){
 const b=$('#ml');if(!b||!cur)return;const dm=cur.t==='dm';
 b.innerHTML=msgs.map(m=>`<div class="m ${m.u===uid?'me':''}">${m.u!==uid&&!dm?`<small>${nm(m.u)}${bd(m.u)}</small>`:''}${E(m.t)}<span class=tt>${tmf(m.ts)}${m.u===uid?' ✓✓':''}</span></div>`).join('')||'<div class="c mu">Сообщений пока нет</div>';
 b.scrollTop=b.scrollHeight;
}
async function send(){
 const i=$('#mi'),t=i.value.trim();if(!t||!cur)return;i.value='';
 try{await db.collection('msgs').add({cid:cur.id,u:uid,t:t.slice(0,2000),ts:Date.now()})}catch(e){i.value=t}
}
let SQ='',ct='chat',dq=0,LM={},cl='dm',sh=0;
const logo=n=>`<svg viewBox="0 0 100 100" width="${n}" height="${n}" fill="currentColor" style="vertical-align:middle"><path d="M50 8 94 90H70L50 52 30 90H6z"/></svg>`;
const tmf=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const BK='<button class=ib onclick="go(\'set\')">← Назад</button>';
const th=()=>{try{return localStorage.getItem('vgt')||'sys'}catch(e){return'sys'}},nt=()=>{try{return localStorage.getItem('vgn')!=='0'}catch(e){return true}};
function applyTheme(){document.documentElement.dataset.theme=th()==='sys'?'':th()}
function cTh(){const n={sys:'light',light:'dark',dark:'sys'}[th()];try{localStorage.setItem('vgt',n)}catch(e){}applyTheme();page()}
function tgN(){try{localStorage.setItem('vgn',nt()?'0':'1')}catch(e){}page()}
function info(k){$('#md2').innerHTML=`<div class=ov><div class=hd><button class=ib onclick="$('#md2').innerHTML=''">←</button><b>${k==='priv'?'Конфиденциальность':'О приложении'}</b></div><div style="padding:16px">${k==='priv'?'<p>Переписки не защищены сквозным шифрованием и видны участникам чата. Пароли и номера хранятся в закрытой части базы и другим пользователям не показываются.</p>':'<div class=lg>'+logo(72)+'<h2>Aurora Messenger</h2><div class=mu>v1.0.0</div></div>'}</div></div>`}
const sr=(i,t,sb,fn)=>`<div class=row onclick="${fn}"><span class=ic style="font-size:20px;width:28px;text-align:center">${i}</span><div><b>${t}</b>${sb?`<div class=mu style="font-size:13px">${sb}</div>`:''}</div><span class=mu>›</span></div>`;
function tgS(){sh=!sh;SQ='';page();if(sh)$('#sq').focus()}
function clist(){const l=CH.filter(c=>c.m.includes(uid)&&c.t===cl).sort((a,b)=>(LM[b.id]?.ts||b.ts||0)-(LM[a.id]?.ts||a.ts||0));
 return l.map(c=>{const m=LM[c.id];return `<div class=row onclick="openCh('${c.id}')"><div class=av>${E(chAv(c))}</div><div><b>${E(chName(c))}</b><div class="mu pv">${m?(m.u===uid?'Вы: ':'')+E(m.t):'Нет сообщений'}</div></div><div class="mu tm">${m?tmf(m.ts):''}</div></div>`}).join('')||'<div class="c mu">Здесь пока пусто. Нажмите + внизу или найдите людей через 🔍.</div>'}
function cq(){const q=($('#sq')?.value||'').trim().toLowerCase().replace(/^@/,'');$('#sr').innerHTML=Object.entries(U).filter(([i,u])=>i!==uid&&(!q||u.nick.includes(q)||u.name.toLowerCase().includes(q))).map(([i,u])=>`<div class=row onclick="showP('${i}')">${av(i)}<div><b>${nm(i)}</b>${bd(i)}<div class=mu>@${E(u.nick)}</div></div></div>`).join('')||'<div class="c mu">Никого нет</div>'}
function tgE(){const e=$('#ep');e.innerHTML=e.innerHTML?'':['😀','😂','😍','👍','🔥','❤','🎉','🙏','😎','🤔','😢','👋'].map(x=>`<button onclick="$('#mi').value+='${x}';$('#mi').focus()">${x}</button>`).join('')}
applyTheme();setTimeout(()=>{const s=document.getElementById('sp');if(s){s.style.opacity=0;setTimeout(()=>s.remove(),450)}},1500);
function chInfo(){
 const c=cur;if(!c)return;const ed=c.t!=='dm'&&(c.o===uid||owner),kind=c.t==='channel'?'канал':'чат',own=G[c.o]?.n||[];
 const ids=(c.wr||[]).filter(i=>own.includes(i)&&N[i]),mine=own.filter(i=>N[i]);
 $('#md2').innerHTML=`<div class=ov><div class=hd><button class=g onclick="$('#md2').innerHTML=''">←</button><b>${ed?'Редактор':'Информация'}</b></div><div style="flex:1;overflow:auto;padding:14px"><div class="card hero" style="text-align:center">${orbit(`<div class=av>${E(chAv(c))}</div>`,ids)}<h2>${E(chName(c))}</h2><div class=mu>${c.t==='channel'?'Канал':c.t==='dm'?'Личный чат':'Чат'} · ${c.m.length} уч.</div><p>${E(c.d||'')}</p></div>
${ed?`<div class=card><input id=xn value="${E(c.name)}" placeholder="Название"><input id=xa value="${E(c.av||'')}" placeholder="Аватар (эмодзи)"><textarea id=xd rows=3 placeholder="Описание">${E(c.d||'')}</textarea><button style="width:100%" onclick="saveCh()">Сохранить</button></div><h3>NFT на ${kind}е (${ids.length}/6)</h3><div class=card>${mine.map(i=>`<div style="display:flex;align-items:center">${nftC(N[i])}<button class=g style="margin-left:auto" onclick="wearCh('${i}')">${(c.wr||[]).includes(i)?'Снять':'Надеть'}</button></div>`).join('')||'<span class=mu>У владельца нет NFT</span>'}</div>`:''}
<button class=g style="width:100%;color:#ff5470" onclick="delCh(this)">${ed?'Удалить '+kind:'Покинуть'}</button></div></div>`;
}
async function saveCh(){
 const n=$('#xn').value.trim();if(!n)return;
 cur={...cur,name:n.slice(0,40),av:Array.from($('#xa').value.trim())[0]||'',d:$('#xd').value.slice(0,200)};
 await db.doc('chats/'+cur.id).set(cur);const h=$('#md .hd b');if(h)h.textContent=cur.name;chInfo();
}
async function wearCh(i){
 const l=cur.wr||[];cur={...cur,wr:l.includes(i)?l.filter(x=>x!==i):[...l,i].slice(-6)};
 await db.doc('chats/'+cur.id).set(cur);chInfo();
}
async function delCh(b){
 if(!dq){dq=1;b.textContent='Нажмите ещё раз для подтверждения';setTimeout(()=>{dq=0},4000);return}
 dq=0;const c=cur,ed=c.t!=='dm'&&(c.o===uid||owner);
 try{
  if(ed){const s=await db.collection('msgs').where('cid','==',c.id).get();await Promise.all(s.docs.map(d=>db.doc('msgs/'+d.id).delete()));await db.doc('chats/'+c.id).delete()}
  else await db.doc('chats/'+c.id).set({...c,m:c.m.filter(x=>x!==uid)});
  $('#md2').innerHTML='';closeCh();
 }catch(e){b.textContent='Не удалось удалить'}
}
function lst(){SQ=$('#sq').value.trim();if(SQ)res();else{page();$('#sq').focus()}}
function plus(){
 ct='chat';
 $('#md').innerHTML=`<div class=ov style="background:#0009;justify-content:flex-end"><div class=card style="margin:0;border-radius:22px 22px 0 0;padding:18px"><h3>Создать</h3><div class=tabs><button id=tc onclick="ct='chat';pt()">💬 Группа</button><button id=tk class=g onclick="ct='channel';pt()">📢 Канал</button></div><input id=cn placeholder="Название"><div class=err id=ce></div><button style="width:100%" onclick="mk()">Создать</button><button class=g style="width:100%;margin-top:8px" onclick="$('#md').innerHTML=''">Отмена</button></div></div>`;
}
function pt(){$('#tc').className=ct==='chat'?'':'g';$('#tk').className=ct==='channel'?'':'g'}
async function mk(){
 const n=$('#cn').value.trim();if(!n)return $('#ce').textContent='Введите название';
 const c={t:ct,name:n.slice(0,40),o:uid,m:[uid],pub:true,ts:Date.now()},id='c'+Date.now();
 try{await db.doc('chats/'+id).set(c);openCh(id,{id,...c})}catch(e){$('#ce').textContent='Не удалось создать'}
}
function closeCh(){if(unM)unM();unM=null;cur=null;$('#md').innerHTML=''}

function admin(p){
 const us=Object.entries(U),nf=Object.entries(N);
 const sel=`<select id=au>${us.map(([i,u])=>`<option value="${i}">${E(u.name)} (@${E(u.nick)})</option>`).join('')}</select>`;
 p.innerHTML=`<div class=adm><h1>🛠 Админ-панель</h1><div class=card><h3>Пользователь</h3>${sel}</div>
 <div class=card><h3>Алмазы 💎</h3><input id=ad type=number placeholder="Количество (можно минус)"><button onclick="aDia()">Выдать / списать</button></div>
 <div class=card><h3>Роль и галочка</h3><select id=ar><option value="">Без роли</option><option value=moder>Модератор</option><option value=admin>Админ</option></select><button onclick="aRole()">Назначить роль</button> <button class=g onclick="aVer()">Галочка вкл/выкл</button></div>
 <div class=card><h3>Создать NFT</h3><input id=nn placeholder="Название"><input id=ne placeholder="Эмодзи, например 🐉"><input id=nc type=color value="#7c4dff"><select id=na><option value=fl>Анимация: парение</option><option value=sp>Анимация: вращение</option><option value=pu>Анимация: пульс</option><option value=sw>Анимация: качание</option><option value=gl>Анимация: свечение</option></select><button onclick="aNft()">Создать и выдать</button></div>
 <div class=card><h3>Выдать существующий NFT</h3><select id=an>${nf.map(([i,n])=>`<option value="${i}">${E(n.e)} ${E(n.name)}</option>`).join('')||'<option value="">нет NFT</option>'}</select><button onclick="aGive()">Выдать</button></div><div class=mu id=am style="font-size:17px"></div></div>`;
}
const au=()=>$('#au').value,say=t=>{$('#am').textContent=t};
async function aDia(){const a=parseInt($('#ad').value);if(!a)return;await gset(au(),{d:Math.max(0,(G[au()]?.d||0)+a)});say('Готово ✓')}
async function aRole(){await gset(au(),{r:$('#ar').value});say('Роль обновлена ✓')}
async function aVer(){await gset(au(),{v:!G[au()]?.v});say('Галочка обновлена ✓')}
async function aNft(){
 const n=$('#nn').value.trim(),e=Array.from($('#ne').value.trim()||'💎')[0];if(!n)return;
 const id='n'+Date.now();await db.doc('nfts/'+id).set({name:n,e,c:$('#nc').value,a:$('#na').value});
 await gset(au(),{n:[...(G[au()]?.n||[]),id]});say('NFT создан и выдан ✓');
}
async function aGive(){const i=$('#an').value;if(!i)return;await gset(au(),{n:[...new Set([...(G[au()]?.n||[]),i])]});say('NFT выдан ✓')}
</script></body></html>
